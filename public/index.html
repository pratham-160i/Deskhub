<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — Deskhub</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 22rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      h1 {
        font-size: 1.25rem;
      }
      label {
        display: block;
        margin-top: 0.75rem;
        font-size: 0.875rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 0.25rem;
        padding: 0.4rem;
      }
      button {
        margin-top: 1rem;
        width: 100%;
        padding: 0.5rem;
      }
      .err {
        color: #b00020;
        margin-top: 0.75rem;
        min-height: 1.25em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Deskhub</h1>
      <p>Sign in</p>
      <form id="login-form" method="post" action="#" novalidate>
        <p id="login-error" class="err" role="alert" hidden></p>
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          required
        />
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
        <button type="submit" id="login-submit">Sign in</button>
      </form>
    </main>
    <script type="module" src="./modules/auth.js"></script>
  </body>
</html>
