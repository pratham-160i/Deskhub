<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deskhub</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        line-height: 1.45;
      }

      .site-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.75rem clamp(0.75rem, 3vw, 1.25rem);
        border-bottom: 1px solid #ddd;
        background: #fafafa;
      }

      .site-brand {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1a2332;
      }

      .btn-signout {
        appearance: none;
        margin: 0;
        padding: 0.45rem 1rem;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        color: #fff;
        background: #c62828;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn-signout:hover {
        background: #b71c1c;
      }
      .btn-signout:focus-visible {
        outline: 2px solid #1565c0;
        outline-offset: 2px;
      }

      .page-main {
        flex: 1;
        padding: clamp(0.75rem, 3vw, 1.25rem);
        width: 100%;
        max-width: 72rem;
        margin: 0 auto;
      }

      .raise-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }

      .btn-raise {
        appearance: none;
        padding: 0.55rem 1.1rem;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #1565c0;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      .btn-raise:hover {
        background: #0d47a1;
      }
      .btn-raise:focus-visible {
        outline: 2px solid #1565c0;
        outline-offset: 2px;
      }

      #raise-panel {
        margin-bottom: 1.25rem;
        padding: 1rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        background: #f9fafb;
        max-width: 32rem;
      }
      #raise-panel[hidden] {
        display: none !important;
      }
      #raise-panel label {
        display: block;
        margin-top: 0.65rem;
        font-size: 0.8rem;
        font-weight: 600;
        color: #444;
      }
      #raise-panel label:first-of-type {
        margin-top: 0;
      }
      #raise-panel input,
      #raise-panel select {
        width: 100%;
        max-width: 24rem;
        margin-top: 0.25rem;
        padding: 0.45rem 0.5rem;
        font: inherit;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .raise-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      .raise-actions button {
        padding: 0.45rem 0.9rem;
        font: inherit;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #999;
        background: #fff;
      }
      .raise-actions button[type="submit"] {
        background: #1565c0;
        color: #fff;
        border-color: #1565c0;
        font-weight: 600;
      }

      #table-wrap {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        border: 1px solid #ddd;
        border-radius: 6px;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 44rem;
      }
      th,
      td {
        border-bottom: 1px solid #e0e0e0;
        padding: 0.5rem 0.65rem;
        text-align: left;
        font-size: clamp(0.8rem, 1.5vw, 0.95rem);
      }
      th {
        background: #f0f0f0;
        font-weight: 600;
        white-space: nowrap;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }

      #loading {
        padding: 1rem;
      }
      #error {
        background: #ffebee;
        padding: 0.75rem 1rem;
        margin-bottom: 1rem;
        border-radius: 6px;
        border: 1px solid #ffcdd2;
        max-width: 40rem;
      }
      #retry {
        margin-top: 0.5rem;
        padding: 0.4rem 0.85rem;
        font: inherit;
        cursor: pointer;
      }
      #empty {
        padding: 1.25rem;
        border: 1px dashed #999;
        border-radius: 6px;
        max-width: 40rem;
      }

      @media (max-width: 480px) {
        .btn-signout {
          width: 100%;
        }
        .site-header {
          flex-direction: column;
          align-items: stretch;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <span class="site-brand">Deskhub</span>
      <button type="button" id="out" class="btn-signout">Sign out</button>
    </header>

    <main class="page-main">
      <div class="raise-row">
        <button type="button" id="btn-raise-toggle" class="btn-raise">
          Raise ticket
        </button>
      </div>

      <div id="raise-panel" hidden>
        <form id="raise-form" method="post" action="#">
          <label for="raise-title">Title</label>
          <input
            id="raise-title"
            name="title"
            type="text"
            required
            maxlength="200"
            autocomplete="off"
          />
          <label for="raise-customer">Customer</label>
          <input
            id="raise-customer"
            name="customer"
            type="text"
            required
            maxlength="120"
            autocomplete="off"
          />
          <label for="raise-priority">Priority</label>
          <select id="raise-priority" name="priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
          <label for="raise-status">Status</label>
          <select id="raise-status" name="status">
            <option value="open" selected>Open</option>
            <option value="pending">Pending</option>
            <option value="closed">Closed</option>
          </select>
          <div class="raise-actions">
            <button type="submit">Submit ticket</button>
            <button type="button" id="raise-cancel">Cancel</button>
          </div>
        </form>
      </div>

      <div id="loading" hidden>Loading…</div>

      <div id="error" hidden>
        <p id="error-msg"></p>
        <button type="button" id="retry">Retry</button>
      </div>

      <div id="empty" hidden>No tickets found</div>

      <div id="table-wrap" hidden>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Customer</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Assignee</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody id="ticket-rows"></tbody>
        </table>
      </div>
    </main>

    <script type="module">
      import * as storage from "./utils/storage.js";
      import * as auth from "./api/auth.js";
      import { initTicketsList } from "./modules/tickets.js";

      if (!storage.get("token")) {
        location.replace("./index.html");
      }

      document.getElementById("out")?.addEventListener("click", async () => {
        await auth.logout();
        location.assign("./index.html");
      });

      initTicketsList();
    </script>
  </body>
</html>
