<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — Deskhub</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Dashboard</h1>
    <p>Placeholder home after login.</p>
    <p><a href="./tickets.html">Tickets</a></p>
    <p><a href="./index.html" id="out">Sign out</a></p>
    <script type="module">
      import * as storage from "./utils/storage.js";
      import * as auth from "./api/auth.js";

      if (!storage.get("token")) {
        location.replace("./index.html");
      }

      document.getElementById("out")?.addEventListener("click", async (e) => {
        e.preventDefault();
        await auth.logout();
        location.assign("./index.html");
      });
    </script>
  </body>
</html>
